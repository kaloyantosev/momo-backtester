[project]
name = "momo-backtester"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyarrow==18.1.0",
    "httpx==0.28.1",
    "websocket-client==1.8.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
